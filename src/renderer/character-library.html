<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; worker-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>角色库 · 呼噜呼噜</title>
  <link rel="stylesheet" href="mascot.css" />
  <link rel="stylesheet" href="character-library.css" />
  <script type="module" src="character-library.js"></script>
</head>
<body>
  <!-- THESIS: Choose artwork, try shared motion, then explicitly apply it.
  OWN-WORLD: Existing milk-white, ink-blue, system type and blue action buttons.
  STORY: Browse local characters or convert a monochrome image; preview before saving.
  FIRST VIEWPORT: A compact left list; right artwork stage with 84/64px samples, motion controls and one apply action.
  FORM: Narrow extension of the approved SVG preview, code-led; no identity or concept change.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
  <header><div><h1>角色库</h1><p>选一个形象，试试动作，再让它陪你。</p></div><button id="choose">导入 PNG / JPG…</button></header>
  <main>
    <nav aria-label="本地角色"><h2>我的角色</h2><div id="catalog"></div><p class="privacy">仅保存在这台 Mac。<br />不会上传或公开分享。</p></nav>
    <section class="detail" aria-label="角色预览">
      <h2 id="name">正在加载…</h2><p id="selection-status" class="selection-status">正在读取当前角色…</p>
      <div class="stage">
        <figure id="original" hidden><span id="original-slot"></span><figcaption>原图</figcaption></figure>
        <figure><div id="large" class="character-host"></div><figcaption id="art-caption">转换后的形象</figcaption></figure>
      </div>
      <div id="draft-fields" hidden><label for="character-name">角色名称</label><input id="character-name" maxlength="40" autocomplete="off" /><p>保留满意的轮廓后再使用；不会自动识别眼睛、尾巴或其他部件。</p></div>
      <div class="sizes"><div><div id="desktop" class="character-host"></div><span>桌面 84px</span></div><div><div id="game" class="character-host"></div><span>游戏 64px</span></div><p id="capabilities">形象与动作独立控制。</p></div>
      <fieldset id="motions" disabled><legend>试试动作</legend><div class="motion-row"><div class="gait-group" role="group" aria-label="步态"><button data-gait="idle" aria-pressed="true">静止</button><button data-gait="walk" aria-pressed="false">行走</button><button data-gait="run" aria-pressed="false">奔跑</button></div><div class="motion-secondary"><button data-reaction="hop">轻跳</button><button id="pause" aria-pressed="false">暂停预览</button></div></div></fieldset>
      <p id="motion-status" class="motion-status">移动指针经过大图，支持眼神的角色会看向你。</p>
      <p id="status" role="status" aria-live="polite">正在读取本地角色…</p>
      <button id="remove" class="danger" hidden>移除角色…</button>
    </section>
  </main>
  <footer><p>白底或透明底的深色单色 PNG/JPG。<br />10 MB 以内、约 100 万像素，不支持直接导入 SVG。</p><div class="actions"><button id="cancel" hidden>放弃导入</button><button id="close">关闭</button><button id="apply" class="primary" disabled>使用这个角色</button></div></footer>
</body>
</html>
