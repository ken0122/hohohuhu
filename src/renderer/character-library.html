<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; worker-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>角色库 · 呼噜呼噜</title>
  <link rel="stylesheet" href="mascot.css" />
  <link rel="stylesheet" href="character-library.css" />
  <script type="module" src="character-library.js"></script>
</head>
<body>
  <!-- THESIS: Choose a living character, understand its temperament, try its motion, then explicitly apply it.
  OWN-WORLD: Existing milk-white, ink-blue, system type and blue action buttons.
  STORY: Browse local characters, see how each one behaves, preview it at real sizes, then choose deliberately.
  FIRST VIEWPORT: A compact left list; right artwork stage followed by temperament, real-size samples, motion and one apply action.
  FORM: Narrow extension of the approved SVG preview, code-led; no identity or concept change.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
  <header><div><h1>角色</h1><p>选角色、试动作，再决定谁陪你。</p></div><button id="choose">添加角色…</button></header>
  <main>
    <nav aria-label="角色列表"><h2>我的角色</h2><div id="catalog"></div><p class="privacy">角色只存在这台 Mac。<br />添加图片时会发给 DeepSeek 分析。</p></nav>
    <section class="detail" aria-label="角色预览">
      <h2 id="name">正在加载…</h2><p id="selection-status" class="selection-status">正在读取当前角色…</p>
      <div class="stage">
        <figure id="original" hidden><span id="original-slot"></span><figcaption>原图</figcaption></figure>
        <figure><div id="large" class="character-host"></div><figcaption id="art-caption">处理后的角色</figcaption></figure>
      </div>
      <div id="draft-fields" hidden>
        <label for="character-name">角色名称</label><input id="character-name" maxlength="40" autocomplete="off" />
        <section id="analysis-editor" aria-label="修正角色分析">
          <div class="analysis-heading"><strong id="quality-label"></strong><span id="quality-explanation"></span></div>
          <div class="analysis-grid">
            <label>角色身份<input id="persona-identity" maxlength="40" /></label>
            <label>性格类型<select id="persona-archetype"><option value="shy">害羞</option><option value="proud">傲娇</option><option value="cheerful">开朗</option><option value="calm">沉稳</option><option value="curious">好奇</option><option value="mischievous">调皮</option></select></label>
            <label>说话方式<select id="persona-voice"><option value="soft">柔软</option><option value="reserved">克制</option><option value="bright">明快</option><option value="steady">平静</option><option value="curious">好奇</option><option value="playful">俏皮</option></select></label>
            <label class="wide">气质说明<input id="persona-summary" maxlength="80" /></label>
            <label class="wide">性格特点<input id="persona-traits" maxlength="51" placeholder="用逗号分隔，最多 4 个" /></label>
          </div>
          <div class="dialogue-heading"><strong>互动台词</strong><span>每项 1–4 句，用“｜”分隔</span></div>
          <div id="dialogue-list" class="dialogue-grid"></div>
          <div class="egg-grid">
            <label>彩蛋名称<input id="egg-label" maxlength="24" /></label>
            <label>触发互动<select id="egg-trigger"><option value="headpat">摸头</option><option value="tickle">挠痒</option><option value="poke">戳一戳</option><option value="cuddle">抱抱</option><option value="nuzzle">贴贴</option><option value="hop">点击脸部</option><option value="shy">点击头部</option></select></label>
            <label class="wide">彩蛋说明<input id="egg-description" maxlength="80" /></label>
            <label class="wide">彩蛋短句<input id="egg-message" maxlength="50" /></label>
          </div>
          <div class="parts-heading"><strong>互动部件</strong><button id="add-part" type="button">添加部件</button></div>
          <div id="parts-list"></div>
          <p>识别结果可以改。坐标按图片宽高取 0–1。</p>
        </section>
      </div>
      <div class="profile-summary" aria-label="角色气质与彩蛋"><p id="personality"></p><p id="easter-egg"></p></div>
      <div class="sizes"><div><div id="desktop" class="character-host"></div><span>桌面 84px</span></div><div><div id="game" class="character-host"></div><span>游戏 64px</span></div><p id="capabilities">形象与动作独立控制。</p></div>
      <fieldset id="motions" disabled><legend>试试动作</legend><div class="motion-row"><div class="gait-group" role="group" aria-label="步态"><button data-gait="idle" aria-pressed="true">静止</button><button data-gait="walk" aria-pressed="false">行走</button><button data-gait="run" aria-pressed="false">奔跑</button></div><div class="motion-secondary"><button data-reaction="hop">轻跳</button><button id="egg-preview">预览彩蛋</button><button id="pause" aria-pressed="false">暂停预览</button></div></div></fieldset>
      <p id="motion-status" class="motion-status">把指针移到大图上，支持眼神的角色会看向你。</p>
      <p id="status" role="status" aria-live="polite">正在读取角色…</p>
      <div class="manage-actions"><button id="edit" hidden>编辑角色</button><button id="remove" class="danger" hidden>删除角色…</button></div>
    </section>
  </main>
  <footer><p>一张图只放一个完整角色，背景透明或纯色。<br />支持 PNG/JPG，10 MB、约 100 万像素以内。</p><div class="actions"><button id="cancel" hidden>取消</button><button id="close">关闭</button><button id="apply" class="primary" disabled>使用角色</button></div></footer>
</body>
</html>
