<!doctype html>
<!-- API settings extend the existing milk-white surface, blue actions and system type.
     Operate: enter credentials, save locally, or return to automatic discovery. -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>聊天设置 · 呼噜呼噜</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="settings.css">
  <script type="module" src="settings.js"></script>
</head>
<body>
  <main>
    <h1 data-i18n="settingsHeading">聊天设置</h1>
    <p class="intro" data-i18n="settingsIntro">连接 DeepSeek 后，就能和角色聊天。使用 deepseek-v4-flash。</p>
    <form id="settings-form">
      <fieldset id="fields" disabled>
        <label for="base-url" data-i18n="baseUrl">接口地址</label>
        <input id="base-url" type="url" required maxlength="256" spellcheck="false" aria-describedby="url-hint">
        <p class="hint" id="url-hint" data-i18n="baseUrlHint">只支持 DeepSeek 官方 HTTPS 地址。</p>
        <label for="api-key" data-i18n="apiKey">API 密钥</label>
        <input id="api-key" type="password" maxlength="4096" autocomplete="off" spellcheck="false" aria-describedby="key-hint">
        <p class="hint" id="key-hint" data-i18n="apiKeyHint">密钥会加密保存在这台 Mac，不会显示或发给其他服务。</p>
        <p id="status" role="status" aria-live="polite" data-i18n="loading">正在读取…</p>
        <div class="actions">
          <button id="clear" type="button" data-i18n="clearConfig">清除配置</button>
          <button id="cancel" type="button" data-i18n="close">关闭</button>
          <button id="save" type="submit" class="primary" data-i18n="save">保存</button>
        </div>
      </fieldset>
    </form>
  </main>
</body>
</html>
