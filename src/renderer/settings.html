<!doctype html>
<!-- API settings extend the existing milk-white surface, blue actions and system type.
     Operate: enter credentials, save locally, or return to automatic discovery. -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>API 设置 · 呼噜呼噜</title>
  <link rel="stylesheet" href="settings.css">
  <script src="settings.js" defer></script>
</head>
<body>
  <main>
    <h1>API 设置</h1>
    <p class="intro">给呼噜呼噜接上聊天能力。<br>固定使用 DeepSeek · deepseek-v4-flash。</p>
    <form id="settings-form">
      <fieldset id="fields" disabled>
        <label for="base-url">Base URL</label>
        <input id="base-url" type="url" required maxlength="256" spellcheck="false" aria-describedby="url-hint">
        <p class="hint" id="url-hint">仅支持官方 DeepSeek HTTPS 地址及 /anthropic 路径。</p>
        <label for="api-key">API Key</label>
        <input id="api-key" type="password" maxlength="4096" autocomplete="off" spellcheck="false" aria-describedby="key-hint">
        <p class="hint" id="key-hint">密钥经系统加密后仅保存在本机，不修改其他应用配置。</p>
        <p id="status" role="status" aria-live="polite">正在读取设置…</p>
        <div class="actions">
          <button id="clear" type="button">清除本机配置</button>
          <button id="cancel" type="button">关闭</button>
          <button id="save" type="submit" class="primary">保存</button>
        </div>
      </fieldset>
    </form>
  </main>
</body>
</html>
