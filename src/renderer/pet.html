<!doctype html>
<!--
THESIS: 桌面上真正有生命、且先让路的小宠物；拒绝固定悬浮按钮和常驻控制面板。
OWN-WORLD: 品牌蓝角色、墨蓝文字、奶白对话气泡；角色本体无框，交互面才有清晰边界。
STORY: 它在工作时躲开，在陪伴时亲近，在用户呼唤时抬头说一句短话。
FIRST VIEWPORT: 透明窗口底部只有约 88px 的宠物；聊天时气泡从头顶展开，输入是唯一主操作。
FORM: 桌面活物而非应用窗口；固定 staging，无随机方向 seed。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>呼噜呼噜</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="pet.css" />
    <link rel="stylesheet" href="mascot.css" />
    <link rel="stylesheet" href="hide-effect.css" />
  </head>
  <body data-mode="dodge">
    <main class="desktop-pet" aria-label="蓝色单眼桌面宠物" data-i18n-aria-label="petA11y">
      <section class="speech" aria-hidden="true" inert>
        <button id="note-badge" class="note-badge" type="button" hidden></button>
        <div id="chat-content">
        <div class="speech__response" aria-live="polite">
          <span class="speech__status" data-i18n="petListening">我在听</span>
          <p id="reply">悄悄说吧，我会小声回答。</p>
        </div>
        <form id="chat-form" class="speech__form">
          <label class="sr-only" for="message" data-i18n="petInputLabel">和桌面宠物聊天</label>
          <input id="message" name="message" maxlength="500" autocomplete="off" placeholder="和它说句话…" data-i18n-placeholder="petPlaceholder" />
          <button type="submit" aria-label="发送消息" data-i18n-aria-label="send">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5m-5 5 5-5 5 5"/></svg>
          </button>
        </form>
        </div>
        <section id="note-panel" class="note-panel" aria-live="polite" hidden>
          <svg class="note-sparkles" viewBox="0 0 240 120" aria-hidden="true"><path d="M206 7l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M226 34l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z"/><path d="M189 44l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/></svg>
          <h2 id="note-heading"></h2>
          <div id="note-details" class="note-details"></div>
          <div id="note-actions" class="note-actions"></div>
          <button id="note-back" class="note-back" type="button"></button>
        </section>
        <button id="dismiss" class="speech__dismiss" type="button" aria-label="关闭聊天" data-i18n-aria-label="closeChat">Esc</button>
      </section>

      <div class="affection" aria-hidden="true">
        <span>♥</span><span>♥</span><span>♥</span>
      </div>
      <button class="pet" id="pet" type="button" aria-label="摸摸宠物">
        <span class="character" id="character"></span>
        <span class="ground" aria-hidden="true"></span>
      </button>
      <span class="sr-only" id="pet-hint" aria-live="polite"></span>
    </main>
    <script type="module" src="pet.js"></script>
  </body>
</html>
