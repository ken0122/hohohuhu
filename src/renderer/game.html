<!doctype html>
<!--
THESIS: 把整块工作屏幕临时变成一局能立刻退出的零食追逐；拒绝复杂菜单和传统游戏大厅。
OWN-WORLD: 深墨蓝遮罩、品牌蓝角色、奶黄豆豆、白色简洁计分。
STORY: 用户按方向键带宠物吃完随机豆豆，随时按 Esc 回到固定陪伴。
FIRST VIEWPORT: 全屏半透明夜幕、散落豆豆和中央宠物；顶部只保留分数与退出提示。
FORM: 屏幕遮罩小游戏，方向键是唯一持续操作；固定 staging，无随机方向 seed。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>呼噜呼噜 · 吃颗豆豆</title>
    <link rel="stylesheet" href="game.css" />
    <link rel="stylesheet" href="mascot.css" />
    <link rel="stylesheet" href="hide-effect.css" />
  </head>
  <body>
    <canvas id="game" aria-label="用方向键操控蓝色单眼宠物吃豆豆" data-i18n-aria-label="gameCanvas"></canvas>
    <header class="hud">
      <div class="game-info">
        <div class="score"><span data-i18n="collected">收集</span><strong id="score">0</strong></div>
        <div class="round-status" id="round-status" aria-live="polite">第 1 盘 · 1.00×</div><span id="round" hidden>1</span><span id="speed" hidden>1.00×</span>
        <p class="level-message" id="level-message" aria-live="polite"></p>
      </div>
      <div class="game-controls">
        <p id="hint"><kbd>↑ ↓ ← →</kbd> <span data-i18n="move">移动</span></p>
        <button id="exit" type="button"><kbd>Esc</kbd> <span data-i18n="exitDesktop">返回桌面</span></button>
      </div>
    </header>
    <div id="game-pet" class="game-pet"></div>
    <script type="module" src="game.js"></script>
  </body>
</html>
